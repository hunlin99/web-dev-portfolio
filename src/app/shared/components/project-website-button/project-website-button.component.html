<div class="button-border">
    <a class="learn-more" [attr.aria-label]="ariaLabel() || label() + ' (opens in a new tab)'"
        [href]="href()" target="_blank" rel="noopener noreferrer">
        <span class="circle" aria-hidden="true">
            <i class="fa fa-link icon icon-link"></i>
            <i class="fa fa-arrow-right icon icon-arrow"></i>
        </span>
        <span class="button-text">{{ label() }}</span>
    </a>
</div>
